services:
  - type: web
    name: nexachat-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: DATABASE_URL
        fromDatabase:
          name: nexachat-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nexachat-redis
          property: connectionString
  - type: keyvalue
    name: nexachat-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: nexachat-db
    plan: free
