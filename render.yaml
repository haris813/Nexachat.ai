services:
  - type: web
    name: nexachat-ai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: AI_PROVIDER
        value: openrouter
      - key: AI_DEMO_MODE
        value: "false"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: APP_URL
        value: https://nexachat-ai-two.vercel.app
      - key: FRONTEND_URL
        value: https://nexachat-ai-two.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: nexachat-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nexachat-redis
          property: connectionString
  - type: keyvalue
    name: nexachat-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: nexachat-db
    plan: free
