services:
  app:
    build: .
    init: true
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://nexachat:nexachat@postgres:5432/nexachat
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      ARTIFACT_DIR: /app/data/artifacts
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - artifact_data:/app/data
    tmpfs:
      - /tmp
    restart: unless-stopped

  worker:
    build: .
    init: true
    command: ["sh", "-c", "flask --app app.py db upgrade && rq worker --url redis://redis:6379/0 nexachat"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://nexachat:nexachat@postgres:5432/nexachat
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      ARTIFACT_DIR: /app/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - artifact_data:/app/data
    tmpfs:
      - /tmp
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexachat
      POSTGRES_USER: nexachat
      POSTGRES_PASSWORD: nexachat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexachat -d nexachat"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  artifact_data:
