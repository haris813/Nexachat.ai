[project]
name = "nexachat-ai"
version = "2.0.0"
description = "Plan-first multimodal AI workspace with cited research, secure files, professional artifacts, voice, and confirmed messaging."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["data", ".venv", "venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = false
warn_unused_ignores = true
exclude = ["migrations", "data"]

[[tool.mypy.overrides]]
module = ["app.models", "app.routes.*", "app.services.artifacts"]
ignore_errors = true
